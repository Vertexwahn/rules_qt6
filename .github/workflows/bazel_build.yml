name: Bazel

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} - Qt ${{ matrix.qt }} - Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.runner }}  # see https://github.com/actions/runner-images
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest supported Qt LTS release (DEFAULT_QT_VERSION in extension/qt_versions.bzl)
          - { os: Ubuntu 26.04 x86_64, runner: ubuntu-26.04, qt: "6.12.1", bazel: "9.x" }
          - { os: Ubuntu 24.04 x86_64, runner: ubuntu-24.04, qt: "6.12.1", bazel: "9.x" }
          - { os: Ubuntu 26.04 aarch64, runner: ubuntu-26.04-arm, qt: "6.12.1", bazel: "9.x" }
          - { os: Ubuntu 24.04 aarch64, runner: ubuntu-24.04-arm, qt: "6.12.1", bazel: "9.x" }
          - { os: macOS 27 arm64, runner: xcode-27, qt: "6.12.1", bazel: "9.x" }
          - { os: macOS 26 arm64, runner: macos-26, qt: "6.12.1", bazel: "9.x" }
          - { os: macOS 26 x86_64, runner: macos-26-intel, qt: "6.12.1", bazel: "9.x" }
          - { os: Windows Server 2025, runner: windows-2025, qt: "6.12.1", bazel: "9.x" }
          # Previous Qt LTS release
          - { os: Ubuntu 24.04 x86_64, runner: ubuntu-24.04, qt: "6.8.3", bazel: "9.x" }
          - { os: macOS 26 arm64, runner: macos-26, qt: "6.8.3", bazel: "9.x" }
          - { os: Windows Server 2025, runner: windows-2025, qt: "6.8.3", bazel: "9.x" }
          # Oldest supported Bazel version
          - { os: Ubuntu 24.04 x86_64, runner: ubuntu-24.04, qt: "6.12.1", bazel: "8.x" }
    defaults:
      run:
        shell: bash
        working-directory: tests

    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      # Git Bash on Windows would turn arguments like //... into /... (MSYS path conversion)
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"

    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true

      # Keep in sync with the Linux prerequisites in README.md
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          # Failing third-party sources of the runner image (e.g. packages.microsoft.com)
          # must not fail the job, all packages below come from the Ubuntu archive
          sudo apt-get update || echo "::warning::apt-get update failed for some sources"
          sudo apt-get install -y \
            libegl-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl-dev \
            libgl1-mesa-dev \
            libpcsclite-dev \
            libpulse-dev \
            libva-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Select Qt ${{ matrix.qt }}
        run: |
          perl -pi -e 's/qt\.install\(version = "[^"]*"\)/qt.install(version = "${{ matrix.qt }}")/' MODULE.bazel
          grep 'qt.install' MODULE.bazel

      - name: Print info
        run: |
          uname -a
          bazel version

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...

      - name: Print Qt version
        run: bazel run //version_test:version_test

  # Stable check name for branch protection
  all_tests_passed:
    name: All tests passed
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
