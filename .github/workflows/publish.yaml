# Publish a release to the Bazel Central Registry.
# See https://github.com/bazel-contrib/publish-to-bcr
name: Publish to BCR

on:
  # Called from release.yml after a successful release
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
  # In case of problems, allow retrying by manually dispatching
  # this workflow from the GitHub UI
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.1
    with:
      tag_name: ${{ inputs.tag_name }}
      # Tags of this repo have no "v" prefix (e.g. 0.0.7)
      tag_prefix: ""
      # GitHub repository which is a fork of bazelbuild/bazel-central-registry
      # where the pull request branch will be pushed.
      registry_fork: Vertexwahn/bazel-central-registry
      # Attestations require releasing via the bazel-contrib release_ruleset
      # workflow, which this repo does not use.
      attest: false
    permissions:
      contents: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
